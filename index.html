<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket Chord Pad</title>

  <!-- PWA & Mobile Full-Screen Metadata -->
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Pocket%20Chord%20Pad%22%2C%22short_name%22%3A%22ChordPad%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23121212%22%2C%22theme_color%22%3A%22%23121212%22%7D">

  <style>
    :root {
      --bg: #121212;
      --card-bg: #1c1c1e;
      --pad-idle: #242426;
      --pad-major-flash: #2563eb;
      --pad-minor-flash: #10b981;
      --text: #ffffff;
      --subtext: #9ca3af;
      --border-color: #38383a;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      gap: 6px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input[type="text"] {
      background: #2a2a2e;
      color: var(--text);
      border: 1px solid #444;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    #custom-inputs {
      display: none;
      width: 100%;
      background: #242428;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      align-items: center;
      gap: 6px;
    }
    #custom-inputs input {
      flex: 1;
      font-family: monospace;
      font-size: 0.9rem;
    }
    #btn-apply-custom {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 6px;
      flex: 1;
    }
    .pad {
      background: var(--pad-idle);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.05s ease-out, transform 0.05s ease-out;
      -webkit-tap-highlight-color: transparent;
    }
    .pad.major:active, .pad.major.active {
      background: var(--pad-major-flash) !important;
      transform: scale(0.96);
    }
    .pad.minor:active, .pad.minor.active {
      background: var(--pad-minor-flash) !important;
      transform: scale(0.96);
    }
    .pad .chord-name {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .pad .type-tag {
      font-size: 0.7rem;
      color: var(--subtext);
      margin-top: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <div class="control-group">
      <label for="key-select">Key</label>
      <select id="key-select">
        <option value="G" selected>G</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="A">A</option>
        <option value="E">E</option>
        <option value="B">B</option>
        <option value="F#">F# / Gb</option>
        <option value="F">F</option>
        <option value="Bb">Bb</option>
        <option value="Eb">Eb</option>
        <option value="Ab">Ab</option>
        <option value="Db">Db</option>
        <option value="custom">★ Custom...</option>
      </select>
    </div>

    <div class="control-group">
      <label for="tone-select">Tone</label>
      <select id="tone-select">
        <option value="distort" selected>Distorted Rock</option>
        <option value="electric">Clean Electric</option>
        <option value="acoustic">Acoustic Guitar</option>
        <option value="pad">Warm Synth Pad</option>
      </select>
    </div>
  </header>

  <div id="custom-inputs">
    <label for="custom-roots">Roots (6):</label>
    <input type="text" id="custom-roots" value="G, B, C, D, E, F#" placeholder="e.g. G, A, B, C, D, E">
    <button id="btn-apply-custom">Set</button>
  </div>

  <div class="grid" id="pad-grid"></div>

  <script>
    let audioCtx = null;
    let distCurve = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function makeDistortionCurve(amount = 45) {
      if (distCurve) return distCurve;
      const k = typeof amount === 'number' ? amount : 50;
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < n_samples; ++i) {
        const x = (i * 2) / n_samples - 1;
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      distCurve = curve;
      return curve;
    }

    const noteFreqs = {
      'C': 130.81, 'C#': 138.59, 'Db': 138.59,
      'D': 146.83, 'D#': 155.56, 'Eb': 155.56,
      'E': 164.81,
      'F': 174.61, 'F#': 185.00, 'Gb': 185.00,
      'G': 196.00, 'G#': 207.65, 'Ab': 207.65,
      'A': 220.00, 'A#': 233.08, 'Bb': 233.08,
      'B': 246.94
    };

    function getChordFrequencies(rootName, isMinor) {
      const cleanRoot = rootName.trim();
      const base = noteFreqs[cleanRoot] || 196.00;
      const thirdRatio = isMinor ? Math.pow(2, 3/12) : Math.pow(2, 4/12);
      const fifthRatio = Math.pow(2, 7/12);
      const octaveRatio = 2.0;

      return [
        base,
        base * thirdRatio,
        base * fifthRatio,
        base * octaveRatio
      ];
    }

    const scaleRoots = {
      'G':  ['G', 'B', 'C', 'D', 'E', 'F#'],
      'C':  ['C', 'E', 'F', 'G', 'A', 'B'],
      'D':  ['D', 'F#', 'G', 'A', 'B', 'C#'],
      'A':  ['A', 'C#', 'D', 'E', 'F#', 'G#'],
      'E':  ['E', 'G#', 'A', 'B', 'C#', 'D#'],
      'B':  ['B', 'D#', 'E', 'F#', 'G#', 'A#'],
      'F#': ['F#', 'A#', 'B', 'C#', 'D#', 'E#'],
      'F':  ['F', 'A', 'Bb', 'C', 'D', 'E'],
      'Bb': ['Bb', 'D', 'Eb', 'F', 'G', 'A'],
      'Eb': ['Eb', 'G', 'Ab', 'Bb', 'C', 'D'],
      'Ab': ['Ab', 'C', 'Db', 'Eb', 'F', 'G'],
      'Db': ['Db', 'F', 'Gb', 'Ab', 'Bb', 'C']
    };

    function playVoicing(freqs, tone) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      freqs.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const noteStart = now + (idx * 0.032);

        if (tone === 'distort') {
          const subOsc = ctx.createOscillator();
          const dist = ctx.createWaveShaper();
          const cabFilter = ctx.createBiquadFilter();

          dist.curve = makeDistortionCurve(50);
          dist.oversample = '4x';

          cabFilter.type = 'lowpass';
          cabFilter.frequency.setValueAtTime(3400, noteStart);

          osc.type = 'sawtooth';
          subOsc.type = 'square';
          osc.frequency.setValueAtTime(freq, noteStart);
          subOsc.frequency.setValueAtTime(freq * 0.5, noteStart);

          gain.gain.setValueAtTime(0.001, noteStart);
          gain.gain.linearRampToValueAtTime(0.24, noteStart + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 2.8);

          osc.connect(dist);
          subOsc.connect(dist);
          dist.connect(cabFilter);
          cabFilter.connect(gain);
          gain.connect(ctx.destination);

          osc.start(noteStart);
          subOsc.start(noteStart);
          osc.stop(noteStart + 2.9);
          subOsc.stop(noteStart + 2.9);

        } else if (tone === 'electric') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, noteStart);
          gain.gain.setValueAtTime(0.001, noteStart);
          gain.gain.exponentialRampToValueAtTime(0.20, noteStart + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 2.0);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(noteStart);
          osc.stop(noteStart + 2.1);

        } else if (tone === 'acoustic') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, noteStart);
          gain.gain.setValueAtTime(0.001, noteStart);
          gain.gain.exponentialRampToValueAtTime(0.32, noteStart + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 1.8);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(noteStart);
          osc.stop(noteStart + 1.9);

        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, noteStart);
          gain.gain.setValueAtTime(0.001, noteStart);
          gain.gain.linearRampToValueAtTime(0.28, noteStart + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 2.6);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(noteStart);
          osc.stop(noteStart + 2.7);
        }
      });
    }

    const grid = document.getElementById('pad-grid');
    const keySelect = document.getElementById('key-select');
    const toneSelect = document.getElementById('tone-select');
    const customArea = document.getElementById('custom-inputs');
    const customInput = document.getElementById('custom-roots');
    const btnApplyCustom = document.getElementById('btn-apply-custom');

    let currentRoots = scaleRoots['G'];

    function buildPads() {
      grid.innerHTML = '';

      currentRoots.forEach((root) => {
        const pad = document.createElement('div');
        pad.className = 'pad major';
        pad.innerHTML = `
          <div class="chord-name">${root}</div>
          <div class="type-tag">Major</div>
        `;
        const freqs = getChordFrequencies(root, false);
        const trigger = (e) => {
          e.preventDefault();
          pad.classList.add('active');
          setTimeout(() => pad.classList.remove('active'), 140);
          playVoicing(freqs, toneSelect.value);
        };
        pad.addEventListener('pointerdown', trigger);
        grid.appendChild(pad);
      });

      currentRoots.forEach((root) => {
        const pad = document.createElement('div');
        pad.className = 'pad minor';
        pad.innerHTML = `
          <div class="chord-name">${root}m</div>
          <div class="type-tag">Minor</div>
        `;
        const freqs = getChordFrequencies(root, true);
        const trigger = (e) => {
          e.preventDefault();
          pad.classList.add('active');
          setTimeout(() => pad.classList.remove('active'), 140);
          playVoicing(freqs, toneSelect.value);
        };
        pad.addEventListener('pointerdown', trigger);
        grid.appendChild(pad);
      });
    }

    keySelect.addEventListener('change', () => {
      if (keySelect.value === 'custom') {
        customArea.style.display = 'flex';
      } else {
        customArea.style.display = 'none';
        currentRoots = scaleRoots[keySelect.value] || scaleRoots['G'];
        buildPads();
      }
    });

    btnApplyCustom.addEventListener('click', () => {
      const parts = customInput.value.split(',').map(s => s.trim()).filter(Boolean);
      if (parts.length > 0) {
        currentRoots = parts.slice(0, 6);
        while (currentRoots.length < 6) {
          currentRoots.push(currentRoots[0]);
        }
        buildPads();
      }
    });

    buildPads();
  </script>
</body>
</html>
