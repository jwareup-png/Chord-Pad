<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket Chord Pad</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --pad-bg: #2a2a2a;
      --pad-active: #2563eb;
      --text: #ffffff;
      --subtext: #9ca3af;
      --accent: #10b981;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      gap: 8px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--subtext);
    }
    select {
      background: var(--pad-bg);
      color: var(--text);
      border: 1px solid #444;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      flex: 1;
    }
    .pad {
      background: var(--pad-bg);
      border: 1px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.08s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }
    .pad:active, .pad.active {
      background: var(--pad-active);
      transform: scale(0.97);
    }
    .pad .chord-name {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .pad .roman-numeral {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="control-group">
      <label for="key-select">Key</label>
      <select id="key-select">
        <option value="C">C</option>
        <option value="G" selected>G</option>
        <option value="D">D</option>
        <option value="A">A</option>
        <option value="E">E</option>
        <option value="F">F</option>
      </select>
    </div>
    <div class="control-group">
      <label for="tone-select">Tone</label>
      <select id="tone-select">
        <option value="acoustic" selected>Acoustic</option>
        <option value="electric">Clean Electric</option>
        <option value="pad">Warm Pad</option>
      </select>
    </div>
  </header>

  <div class="grid" id="pad-grid"></div>

  <script>
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const keyChords = {
      'C': [
        { name: 'C',  roman: 'I',   notes: [130.81, 164.81, 196.00, 261.63] },
        { name: 'Dm', roman: 'ii',  notes: [146.83, 174.61, 220.00, 293.66] },
        { name: 'Em', roman: 'iii', notes: [164.81, 196.00, 246.94, 329.63] },
        { name: 'F',  roman: 'IV',  notes: [174.61, 220.00, 261.63, 349.23] },
        { name: 'G',  roman: 'V',   notes: [196.00, 246.94, 293.66, 392.00] },
        { name: 'Am', roman: 'vi',  notes: [220.00, 261.63, 329.63, 440.00] }
      ],
      'G': [
        { name: 'G',  roman: 'I',   notes: [196.00, 246.94, 293.66, 392.00] },
        { name: 'Am', roman: 'ii',  notes: [220.00, 261.63, 329.63, 440.00] },
        { name: 'Bm', roman: 'iii', notes: [246.94, 293.66, 369.99, 493.88] },
        { name: 'C',  roman: 'IV',  notes: [130.81, 164.81, 196.00, 261.63] },
        { name: 'D',  roman: 'V',   notes: [146.83, 185.00, 220.00, 293.66] },
        { name: 'Em', roman: 'vi',  notes: [164.81, 196.00, 246.94, 329.63] }
      ],
      'D': [
        { name: 'D',   roman: 'I',   notes: [146.83, 185.00, 220.00, 293.66] },
        { name: 'Em',  roman: 'ii',  notes: [164.81, 196.00, 246.94, 329.63] },
        { name: 'F#m', roman: 'iii', notes: [185.00, 220.00, 277.18, 369.99] },
        { name: 'G',   roman: 'IV',  notes: [196.00, 246.94, 293.66, 392.00] },
        { name: 'A',   roman: 'V',   notes: [220.00, 277.18, 329.63, 440.00] },
        { name: 'Bm',  roman: 'vi',  notes: [246.94, 293.66, 369.99, 493.88] }
      ],
      'A': [
        { name: 'A',   roman: 'I',   notes: [220.00, 277.18, 329.63, 440.00] },
        { name: 'Bm',  roman: 'ii',  notes: [246.94, 293.66, 369.99, 493.88] },
        { name: 'C#m', roman: 'iii', notes: [138.59, 164.81, 207.65, 277.18] },
        { name: 'D',   roman: 'IV',  notes: [146.83, 185.00, 220.00, 293.66] },
        { name: 'E',   roman: 'V',   notes: [164.81, 207.65, 246.94, 329.63] },
        { name: 'F#m', roman: 'vi',  notes: [185.00, 220.00, 277.18, 369.99] }
      ],
      'E': [
        { name: 'E',   roman: 'I',   notes: [164.81, 207.65, 246.94, 329.63] },
        { name: 'F#m', roman: 'ii',  notes: [185.00, 220.00, 277.18, 369.99] },
        { name: 'G#m', roman: 'iii', notes: [207.65, 246.94, 311.13, 415.30] },
        { name: 'A',   roman: 'IV',  notes: [220.00, 277.18, 329.63, 440.00] },
        { name: 'B',   roman: 'V',   notes: [246.94, 311.13, 369.99, 493.88] },
        { name: 'C#m', roman: 'vi',  notes: [138.59, 164.81, 207.65, 277.18] }
      ],
      'F': [
        { name: 'F',  roman: 'I',   notes: [174.61, 220.00, 261.63, 349.23] },
        { name: 'Gm', roman: 'ii',  notes: [196.00, 233.08, 293.66, 392.00] },
        { name: 'Am', roman: 'iii', notes: [220.00, 261.63, 329.63, 440.00] },
        { name: 'Bb', roman: 'IV',  notes: [233.08, 293.66, 349.23, 466.16] },
        { name: 'C',  roman: 'V',   notes: [130.81, 164.81, 196.00, 261.63] },
        { name: 'Dm', roman: 'vi',  notes: [146.83, 174.61, 220.00, 293.66] }
      ]
    };

    function playChord(chord) {
      const ctx = initAudio();
      if (!ctx) return;

      const tone = document.getElementById('tone-select').value;
      const now = ctx.currentTime;

      chord.notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        // 35ms strum stagger between strings
        const noteStart = now + (idx * 0.035);

        if (tone === 'acoustic') {
          osc.type = 'triangle';
          gain.gain.setValueAtTime(0.0001, noteStart);
          gain.gain.exponentialRampToValueAtTime(0.35, noteStart + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 1.8);
        } else if (tone === 'electric') {
          osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.0001, noteStart);
          gain.gain.exponentialRampToValueAtTime(0.20, noteStart + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 2.0);
        } else {
          // Warm Pad
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.0001, noteStart);
          gain.gain.linearRampToValueAtTime(0.28, noteStart + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 2.4);
        }

        osc.frequency.setValueAtTime(freq, noteStart);
        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(noteStart);
        osc.stop(noteStart + 2.5);
      });
    }

    const grid = document.getElementById('pad-grid');
    const keySelect = document.getElementById('key-select');

    function renderPads() {
      grid.innerHTML = '';
      const selectedKey = keySelect.value;
      const chords = keyChords[selectedKey];

      chords.forEach((chord) => {
        const pad = document.createElement('div');
        pad.className = 'pad';
        pad.innerHTML = `
          <div class="chord-name">${chord.name}</div>
          <div class="roman-numeral">${chord.roman}</div>
        `;

        const handlePress = (e) => {
          e.preventDefault();
          pad.classList.add('active');
          setTimeout(() => pad.classList.remove('active'), 120);
          playChord(chord);
        };

        // Pointerdown cleanly handles both mouse clicks and mobile touchscreen taps
        pad.addEventListener('pointerdown', handlePress);
        grid.appendChild(pad);
      });
    }

    keySelect.addEventListener('change', renderPads);
    renderPads();
  </script>
</body>
</html>
